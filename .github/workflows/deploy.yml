name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant GitHub Actions permission to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Mystery Bento static bundle
        env:
          PORT: 3000
          BASE_PATH: /Mystery-Bento-Contest/
        run: pnpm --filter @workspace/mystery-bento run build

      - name: Setup SPA fallback & disable Jekyll
        run: |
          # Copy index.html to 404.html so direct URLs like /race-track-debug work on reload
          cp artifacts/mystery-bento/dist/public/index.html artifacts/mystery-bento/dist/public/404.html
          touch artifacts/mystery-bento/dist/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/mystery-bento/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
